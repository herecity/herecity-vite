# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Test After Merge

on:
  push:
    branches: ["develop"]
  pull_request:
    types: [closed]
    branches: ["develop"]

concurrency:
  group: test-after-merge
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    strategy:
      matrix:
        node-version: ["20.x"]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Sleep for 1 minute
        run: sleep 60

      - name: test
        run: yarn test

  update-pr-protection-on-hotfix-merged:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'hotfix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Update PR protection rule
        uses: ./.github/actions/update-branch-protection
        with:
          review-count: 6
          token: ${{ secrets.ADMIN_TOKEN }}

  restore-original-pr-protection:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Update PR protection rule
        uses: ./.github/actions/update-branch-protection
        with:
          review-count: 1
          token: ${{ secrets.ADMIN_TOKEN }}
