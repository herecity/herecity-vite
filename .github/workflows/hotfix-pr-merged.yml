name: Hotfix PR Merged

on:
  pull_request:
    types: [closed]
    branches: ["develop"]

jobs:
  update-pr-protection-on-hotfix-merged:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'hotfix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Update PR protection rule
        uses: ./.github/actions/update-branch-protection
        with:
          review-count: 6
          token: ${{ secrets.ADMIN_TOKEN }}
